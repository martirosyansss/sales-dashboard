{% extends "base.html" %}

{% block title %}Продажи - Sales Management{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h1 class="mb-4">
            <i class="fas fa-shopping-cart text-primary"></i> Управление продажами
        </h1>
    </div>
</div>

<div class="row">
    <div class="col-12">
        <div class="card shadow">
            <div class="card-header">
                <h5 class="mb-0">
                    <i class="fas fa-list"></i> История продаж
                </h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover" id="salesTable">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Клиент</th>
                                <th>Дата</th>
                                <th>Сумма</th>
                                <th>Статус</th>
                                <th>Товаров</th>
                                <th>Действия</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
let salesTable;

$(document).ready(function() {
    loadSales();
});

function loadSales() {
    $.get('/api/sales', function(data) {
        salesTable = $('#salesTable').DataTable({
            data: data,
            columns: [
                { data: 'id' },
                { data: 'customer' },
                { data: 'date' },
                { 
                    data: 'total',
                    render: function(data) {
                        return formatCurrency(data);
                    }
                },
                {
                    data: 'status',
                    render: function(data) {
                        let badge = 'secondary';
                        let text = data;
                        
                        if (data === 'Completed') {
                            badge = 'success';
                            text = 'Завершена';
                        } else if (data === 'Pending') {
                            badge = 'warning';
                            text = 'Ожидает';
                        } else if (data === 'Cancelled') {
                            badge = 'danger';
                            text = 'Отменена';
                        }
                        
                        return `<span class="badge bg-${badge}">${text}</span>`;
                    }
                },
                { data: 'items' },
                {
                    data: null,
                    render: function(data) {
                        return `
                            <button class="btn btn-sm btn-info" onclick="viewSale(${data.id})" title="Просмотр">
                                <i class="fas fa-eye"></i>
                            </button>
                        `;
                    }
                }
            ],
            language: {
                url: '//cdn.datatables.net/plug-ins/1.13.6/i18n/ru.json'
            },
            pageLength: 25,
            order: [[2, 'desc']]
        });
    });
}

function viewSale(id) {
    alert(`Просмотр продажи #${id}\n\nДетальная информация о продаже будет доступна в следующей версии.`);
}

function formatCurrency(amount) {
    return new Intl.NumberFormat('ru-RU', {
        style: 'currency',
        currency: 'RUB',
        minimumFractionDigits: 0
    }).format(amount);
}
</script>
{% endblock %}
