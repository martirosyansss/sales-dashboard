{% extends "base.html" %}

{% block title %}Товары - Sales Management{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h1 class="mb-4">
            <i class="fas fa-box text-primary"></i> Управление товарами
        </h1>
    </div>
</div>

<div class="row">
    <div class="col-12">
        <div class="card shadow">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">
                    <i class="fas fa-list"></i> Каталог товаров
                </h5>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#productModal" onclick="openAddModal()">
                    <i class="fas fa-plus"></i> Добавить товар
                </button>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover" id="productsTable">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Название</th>
                                <th>Категория</th>
                                <th>Цена</th>
                                <th>На складе</th>
                                <th>Продано</th>
                                <th>Статус</th>
                                <th>Действия</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Product Modal -->
<div class="modal fade" id="productModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Добавить товар</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="productForm">
                    <input type="hidden" id="productId">
                    <div class="mb-3">
                        <label for="productName" class="form-label">Название *</label>
                        <input type="text" class="form-control" id="productName" required>
                    </div>
                    <div class="mb-3">
                        <label for="productCategory" class="form-label">Категория</label>
                        <input type="text" class="form-control" id="productCategory" 
                               list="categoryList" placeholder="Выберите или введите категорию">
                        <datalist id="categoryList">
                            <option value="Электроника">
                            <option value="Периферия">
                            <option value="Мебель">
                            <option value="Аксессуары">
                            <option value="Комплектующие">
                            <option value="Аудио">
                        </datalist>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="productPrice" class="form-label">Цена *</label>
                            <input type="number" class="form-control" id="productPrice" 
                                   min="0" step="0.01" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="productStock" class="form-label">Количество на складе *</label>
                            <input type="number" class="form-control" id="productStock" 
                                   min="0" value="0" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="productDescription" class="form-label">Описание</label>
                        <textarea class="form-control" id="productDescription" rows="3"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                <button type="button" class="btn btn-primary" onclick="saveProduct()">Сохранить</button>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
let productsTable;

$(document).ready(function() {
    loadProducts();
});

function loadProducts() {
    $.get('/api/products', function(data) {
        productsTable = $('#productsTable').DataTable({
            data: data,
            columns: [
                { data: 'id' },
                { data: 'name' },
                { data: 'category' },
                { 
                    data: 'price',
                    render: function(data) {
                        return formatCurrency(data);
                    }
                },
                { 
                    data: 'stock',
                    render: function(data) {
                        let badge = 'success';
                        if (data === 0) badge = 'danger';
                        else if (data <= 10) badge = 'warning';
                        return `<span class="badge bg-${badge}">${data}</span>`;
                    }
                },
                { data: 'sold' },
                {
                    data: null,
                    render: function(data) {
                        if (data.stock === 0) {
                            return '<span class="badge bg-danger">Нет в наличии</span>';
                        } else if (data.stock <= 10) {
                            return '<span class="badge bg-warning">Заканчивается</span>';
                        } else {
                            return '<span class="badge bg-success">В наличии</span>';
                        }
                    }
                },
                {
                    data: null,
                    render: function(data) {
                        return `
                            <button class="btn btn-sm btn-info" onclick="editProduct(${data.id})">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="deleteProduct(${data.id})">
                                <i class="fas fa-trash"></i>
                            </button>
                        `;
                    }
                }
            ],
            language: {
                url: '//cdn.datatables.net/plug-ins/1.13.6/i18n/ru.json'
            },
            pageLength: 25,
            order: [[0, 'asc']]
        });
    });
}

function openAddModal() {
    $('#modalTitle').text('Добавить товар');
    $('#productForm')[0].reset();
    $('#productId').val('');
}

function editProduct(id) {
    const product = productsTable.data().toArray().find(p => p.id === id);
    $('#modalTitle').text('Редактировать товар');
    $('#productId').val(product.id);
    $('#productName').val(product.name);
    $('#productCategory').val(product.category);
    $('#productPrice').val(product.price);
    $('#productStock').val(product.stock);
    $('#productDescription').val(product.description);
    $('#productModal').modal('show');
}

function saveProduct() {
    const id = $('#productId').val();
    const data = {
        name: $('#productName').val(),
        category: $('#productCategory').val(),
        price: parseFloat($('#productPrice').val()),
        stock: parseInt($('#productStock').val()),
        description: $('#productDescription').val()
    };

    if (!data.name || !data.price) {
        alert('Заполните обязательные поля!');
        return;
    }

    const method = id ? 'PUT' : 'POST';
    const url = id ? `/api/products/${id}` : '/api/products';

    $.ajax({
        url: url,
        method: method,
        contentType: 'application/json',
        data: JSON.stringify(data),
        success: function() {
            $('#productModal').modal('hide');
            productsTable.destroy();
            loadProducts();
            showNotification('Успех', 'Товар сохранен!', 'success');
        },
        error: function() {
            showNotification('Ошибка', 'Не удалось сохранить товар', 'danger');
        }
    });
}

function deleteProduct(id) {
    if (!confirm('Вы уверены, что хотите удалить этот товар?')) {
        return;
    }

    $.ajax({
        url: `/api/products/${id}`,
        method: 'DELETE',
        success: function() {
            productsTable.destroy();
            loadProducts();
            showNotification('Успех', 'Товар удален!', 'success');
        },
        error: function() {
            showNotification('Ошибка', 'Не удалось удалить товар. Возможно, есть связанные продажи.', 'danger');
        }
    });
}

function formatCurrency(amount) {
    return new Intl.NumberFormat('ru-RU', {
        style: 'currency',
        currency: 'RUB',
        minimumFractionDigits: 0
    }).format(amount);
}

function showNotification(title, message, type) {
    const alertHtml = `
        <div class="alert alert-${type} alert-dismissible fade show position-fixed top-0 end-0 m-3" role="alert" style="z-index: 9999;">
            <strong>${title}:</strong> ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    `;
    $('body').append(alertHtml);
    setTimeout(() => $('.alert').alert('close'), 3000);
}
</script>
{% endblock %}
