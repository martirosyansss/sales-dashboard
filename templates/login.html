<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Sales Dashboard v2.0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(1200px 600px at 50% -10%, #1b2a3a 0%, #0d1117 55%, #0a0d12 100%);
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            background: rgba(22, 27, 34, 0.9);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
        }
        .login-brand {
            font-weight: 700;
            letter-spacing: 0.2px;
        }
        .login-brand i { color: #3b82f6; }
    </style>
</head>
<body>
    <div class="login-card p-4 p-md-5">
        <div class="text-center mb-4">
            <div class="login-brand fs-4 mb-1">
                <i class="fas fa-chart-line me-2"></i>Sales Dashboard
            </div>
            <div class="text-muted small">Вход в систему</div>
        </div>

        {% if error %}
        <div class="alert alert-danger py-2" role="alert">
            <i class="fas fa-circle-exclamation me-1"></i> {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}" autocomplete="off">
            <input type="hidden" name="next" value="{{ next or '' }}">
            <div class="mb-3">
                <label class="form-label">Логин</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                    <input type="text" name="username" class="form-control" required autofocus
                           placeholder="Логин">
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label">Пароль</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input type="password" name="password" class="form-control" required
                           placeholder="Пароль">
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100">
                <i class="fas fa-right-to-bracket me-1"></i> Войти
            </button>
        </form>

        <div class="text-center text-muted small mt-4">
            <i class="fas fa-lock"></i> READ-ONLY аналитика · AS-Sales Management 7
        </div>
    </div>
</body>
</html>
